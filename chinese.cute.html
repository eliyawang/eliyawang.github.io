            <h1>我可愛的寵物們</h1>
            <h2>Cats</h2>

    </body>
        <div class="cat-box">
            <figure><img src="img1/cat1.jpg" /></figure>
            <p>
           我的家裡養了2隻貓，左邊的那隻叫做 <b>娜娜(Nana)</b>, 右邊的那隻叫做 <b>莉莉(Lily)</b>. 她們兩隻都是從街上被救援回來的，而且都是母的
            </p>
        </div>

        <div class="cat1-box">
        <figure><img src="img1/Nana.jpg" /></figure>
        <figure><img src="img1/Nana1_.jpg" /></figure>

        <p>
        娜娜是一隻七點五公斤的胖貓，他今年已經7歲了而且很貪吃。但是他對人沒有甚麼警戒心，是一隻很親人的貓
        </p>
        </div>
        <div class="cat2-box">
        <figure><img src="img1/lily.jpg" /></figure>
        <figure><img src="img1/lily1_.jpg" /></figure>

        <p>
            莉莉則是相對比較內向的小貓，她今年已經6歲了，跟胖胖的娜娜不一樣，莉莉很瘦小且容易被外界的事物嚇到，但她還是很可愛。
        </p>
        </div>
